<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" font-family="Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">序列并行：量化张量的 all-gather（一种可能的场景）</title>
<desc id="desc">输入在前向量化为 rowwise 和 columnwise 两种表示。rowwise 经 all-gather 用于前向，columnwise 保存到反向后经 all-gather 用于权重梯度。输出梯度在反向量化，两种表示经 all-gather 用于后续梯度计算。实际通信路径由 recipe 和模块配置决定。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<rect width="1100" height="790" fill="white"/>
<text x="550" y="38" text-anchor="middle" font-size="23" fill="#26364a" font-weight="bold">序列并行：量化张量的 all-gather</text>
<text x="550" y="67" text-anchor="middle" font-size="14" fill="#617084">一种可能的场景 · 输入 / 输出梯度两条数据流</text>
<text x="550" y="110" text-anchor="middle" font-size="18" fill="#26364a" font-weight="bold">输入张量 X：前向量化，columnwise 表示保存到反向</text>
<text x="45" y="176" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">前向</text>
<rect x="90" y="142" width="150" height="60" rx="7" fill="#f2e7f7" stroke="#a77cba" stroke-width="1.5"/>
<text x="165.0" y="166.5" text-anchor="middle" font-size="15" fill="#26364a">高精度输入</text>
<text x="165.0" y="187.5" text-anchor="middle" font-size="15" fill="#26364a">本地分片 X</text>
<path d="M 240 172 H 278" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280" y="142" width="120" height="60" rx="7" fill="#e3f1dc" stroke="#82a76e" stroke-width="1.5"/>
<text x="340.0" y="166.5" text-anchor="middle" font-size="15" fill="#26364a">量化</text>
<text x="340.0" y="187.5" text-anchor="middle" font-size="15" fill="#26364a">两种 usage</text>
<path d="M 400 172 H 448" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="450" y="142" width="175" height="60" rx="7" fill="#fff0d9" stroke="#d79b42" stroke-width="1.5"/>
<text x="537.5" y="166.5" text-anchor="middle" font-size="15" fill="#26364a">rowwise</text>
<text x="537.5" y="187.5" text-anchor="middle" font-size="15" fill="#26364a">量化分片</text>
<path d="M 625 172 H 678" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="142" width="140" height="60" rx="7" fill="#e1f1fc" stroke="#6a9fc5" stroke-width="1.5"/>
<text x="750.0" y="177.0" text-anchor="middle" font-size="15" fill="#26364a">All-gather</text>
<path d="M 820 172 H 878" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="880" y="142" width="175" height="60" rx="7" fill="#f1f4f8" stroke="#9aaabd" stroke-width="1.5"/>
<text x="967.5" y="166.5" text-anchor="middle" font-size="15" fill="#26364a">前向 GEMM</text>
<text x="967.5" y="187.5" text-anchor="middle" font-size="15" fill="#26364a">Y = X Wᵀ</text>
<text x="45" y="310" text-anchor="middle" font-size="15" fill="#b34438" font-weight="bold">反向</text>
<path d="M 340 202 V 305 H 448" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="225" y="248" text-anchor="middle" font-size="13" fill="#617084">前向生成 columnwise</text>
<text x="225" y="270" text-anchor="middle" font-size="13" fill="#617084">保存本地分片供反向使用</text>
<rect x="450" y="275" width="175" height="60" rx="7" fill="#fff0d9" stroke="#d79b42" stroke-width="1.5"/>
<text x="537.5" y="299.5" text-anchor="middle" font-size="15" fill="#26364a">columnwise</text>
<text x="537.5" y="320.5" text-anchor="middle" font-size="15" fill="#26364a">量化分片</text>
<path d="M 625 305 H 678" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="275" width="140" height="60" rx="7" fill="#e1f1fc" stroke="#6a9fc5" stroke-width="1.5"/>
<text x="750.0" y="310.0" text-anchor="middle" font-size="15" fill="#26364a">All-gather</text>
<path d="M 820 305 H 878" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="880" y="275" width="175" height="60" rx="7" fill="#f1f4f8" stroke="#9aaabd" stroke-width="1.5"/>
<text x="967.5" y="299.5" text-anchor="middle" font-size="15" fill="#26364a">权重梯度 GEMM</text>
<text x="967.5" y="320.5" text-anchor="middle" font-size="15" fill="#26364a">dW = Gᵀ X</text>
<path d="M 35 370 H 1065" stroke="#d5dce5" stroke-width="1.5"/>
<text x="550" y="409" text-anchor="middle" font-size="18" fill="#26364a" font-weight="bold">输出梯度 G：反向即时量化，按后续 GEMM 的 usage 使用</text>
<text x="45" y="520" text-anchor="middle" font-size="15" fill="#b34438" font-weight="bold">反向</text>
<rect x="90" y="484" width="150" height="60" rx="7" fill="#f2e7f7" stroke="#a77cba" stroke-width="1.5"/>
<text x="165.0" y="508.5" text-anchor="middle" font-size="15" fill="#26364a">高精度输出梯度</text>
<text x="165.0" y="529.5" text-anchor="middle" font-size="15" fill="#26364a">本地分片 G</text>
<path d="M 240 514 H 278" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280" y="484" width="120" height="60" rx="7" fill="#e3f1dc" stroke="#82a76e" stroke-width="1.5"/>
<text x="340.0" y="508.5" text-anchor="middle" font-size="15" fill="#26364a">量化</text>
<text x="340.0" y="529.5" text-anchor="middle" font-size="15" fill="#26364a">两种 usage</text>
<path d="M 400 499 L 448 470" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 400 529 L 448 560" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="450" y="440" width="175" height="60" rx="7" fill="#fff0d9" stroke="#d79b42" stroke-width="1.5"/>
<text x="537.5" y="464.5" text-anchor="middle" font-size="15" fill="#26364a">columnwise</text>
<text x="537.5" y="485.5" text-anchor="middle" font-size="15" fill="#26364a">量化分片</text>
<rect x="450" y="530" width="175" height="60" rx="7" fill="#fff0d9" stroke="#d79b42" stroke-width="1.5"/>
<text x="537.5" y="554.5" text-anchor="middle" font-size="15" fill="#26364a">rowwise</text>
<text x="537.5" y="575.5" text-anchor="middle" font-size="15" fill="#26364a">量化分片</text>
<path d="M 625 470 L 678 500" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 625 560 L 678 530" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="484" width="140" height="60" rx="7" fill="#e1f1fc" stroke="#6a9fc5" stroke-width="1.5"/>
<text x="750.0" y="519.0" text-anchor="middle" font-size="15" fill="#26364a">All-gather</text>
<path d="M 820 514 H 878" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arr)"/>
<rect x="880" y="478" width="175" height="72" rx="7" fill="#f1f4f8" stroke="#9aaabd" stroke-width="1.5"/>
<text x="967.5" y="498.0" text-anchor="middle" font-size="15" fill="#26364a">后续梯度 GEMM</text>
<text x="967.5" y="519.0" text-anchor="middle" font-size="15" fill="#26364a">dW（columnwise）</text>
<text x="967.5" y="540.0" text-anchor="middle" font-size="15" fill="#26364a">dX（rowwise）</text>
<rect x="130" y="612" width="28" height="20" rx="4" fill="#f2e7f7" stroke="#a77cba"/>
<text x="233" y="628" text-anchor="middle" font-size="14" fill="#26364a">高精度张量</text>
<rect x="370" y="612" width="28" height="20" rx="4" fill="#fff0d9" stroke="#d79b42"/>
<text x="473" y="628" text-anchor="middle" font-size="14" fill="#26364a">量化张量</text>
<rect x="600" y="612" width="28" height="20" rx="4" fill="#e3f1dc" stroke="#82a76e"/>
<text x="703" y="628" text-anchor="middle" font-size="14" fill="#26364a">量化操作</text>
<rect x="830" y="612" width="28" height="20" rx="4" fill="#e1f1fc" stroke="#6a9fc5"/>
<text x="933" y="628" text-anchor="middle" font-size="14" fill="#26364a">集合通信</text>
<rect x="35" y="660" width="1030" height="103" rx="9" fill="#f8fafc" stroke="#d5dce5"/>
<text x="550" y="687" text-anchor="middle" font-size="11" fill="#26364a">All-gather 后，每个参与 Rank 都获得完整张量；量化数据所需的 scale 处理由 recipe 决定。</text>
  <text x="550" y="714" text-anchor="middle" font-size="11" fill="#26364a">上下两部分对应不同的通信需求，不表示每个 Linear 都执行图中全部通信。</text>
  <text x="550" y="741" text-anchor="middle" font-size="11" fill="#26364a">图中按逻辑 usage 展示；实际传输表示、通信次数及是否回退到高精度取决于后端与模块配置。</text>
</svg>
