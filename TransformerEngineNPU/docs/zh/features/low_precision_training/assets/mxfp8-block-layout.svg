<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">MXFP8 分块布局：每 32 个连续元素共用一个 E8M0 缩放因子</text>

  <!-- 面板 A：数据矩阵 -->
  <rect x="40" y="72" width="500" height="142" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="290" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">数据矩阵 [M, K]（rowwise 视角）</text>
  <g stroke="#90a4ae" stroke-width="0.75" fill="#ffffff">
    <rect x="100" y="110" width="68" height="18"/><rect x="172" y="110" width="68" height="18"/><rect x="244" y="110" width="68" height="18"/><rect x="316" y="110" width="68" height="18"/><rect x="388" y="110" width="68" height="18"/><rect x="460" y="110" width="68" height="18"/>
    <rect x="100" y="150" width="68" height="18"/><rect x="172" y="150" width="68" height="18"/><rect x="244" y="150" width="68" height="18"/><rect x="316" y="150" width="68" height="18"/><rect x="388" y="150" width="68" height="18"/><rect x="460" y="150" width="68" height="18"/>
    <rect x="100" y="170" width="68" height="18"/><rect x="172" y="170" width="68" height="18"/><rect x="244" y="170" width="68" height="18"/><rect x="316" y="170" width="68" height="18"/><rect x="388" y="170" width="68" height="18"/><rect x="460" y="170" width="68" height="18"/>
  </g>
  <!-- 高亮行（第 m 行） -->
  <g stroke="#ef6c00" stroke-width="1.2" fill="#fff3e0">
    <rect x="100" y="130" width="68" height="18"/><rect x="172" y="130" width="68" height="18"/><rect x="244" y="130" width="68" height="18"/><rect x="316" y="130" width="68" height="18"/><rect x="388" y="130" width="68" height="18"/><rect x="460" y="130" width="68" height="18"/>
  </g>
  <rect x="98" y="128" width="432" height="22" fill="none" stroke="#ef6c00" stroke-width="1.8"/>
  <text x="92" y="144" text-anchor="end" font-size="11" fill="#546e7a">第 m 行</text>
  <text x="290" y="206" text-anchor="middle" font-size="11.5" fill="#546e7a">每行沿 K 方向、每 32 个连续元素划为一块（每格示意一个块）</text>

  <line x1="290" y1="220" x2="290" y2="244" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 面板 B：放大一行 -->
  <rect x="40" y="248" width="500" height="136" rx="8" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/>
  <text x="290" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">放大第 m 行：K/32 个块，每块各有一个缩放因子</text>
  <g stroke="#90a4ae" stroke-width="1">
    <rect x="68" y="292" width="88" height="46" rx="4" fill="#e3f2fd" stroke="#2e7d32" stroke-width="2.5"/>
    <rect x="161" y="292" width="88" height="46" rx="4" fill="#bbdefb"/>
    <rect x="254" y="292" width="88" height="46" rx="4" fill="#e3f2fd"/>
    <rect x="347" y="292" width="88" height="46" rx="4" fill="#bbdefb"/>
    <rect x="440" y="292" width="88" height="46" rx="4" fill="#e3f2fd"/>
  </g>
  <g font-size="12.5" fill="#263238" text-anchor="middle">
    <text x="112" y="319">块 0</text><text x="205" y="319">块 1</text><text x="298" y="319">块 2</text><text x="391" y="319">块 3</text><text x="484" y="319">块 4</text>
  </g>
  <g font-size="11.5" fill="#37474f" text-anchor="middle">
    <text x="112" y="356" font-weight="bold" fill="#1b5e20">s₀ = 2⁻⁷</text><text x="205" y="356">s₁ = 2⁻⁴</text><text x="298" y="356">s₂ = 2⁻⁶</text><text x="391" y="356">s₃ = 2⁻⁵</text><text x="484" y="356">s₄ = 2⁻⁷</text>
  </g>

  <line x1="112" y1="346" x2="112" y2="396" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 面板 C：放大块 0 -->
  <rect x="40" y="400" width="500" height="196" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="290" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">放大块 0：32 个元素与缩放因子计算</text>
  <g stroke="#90a4ae" stroke-width="0.75" fill="#eceff1">
    <rect x="58" y="442" width="22" height="22"/><rect x="82" y="442" width="22" height="22"/><rect x="106" y="442" width="22" height="22"/><rect x="130" y="442" width="22" height="22"/><rect x="154" y="442" width="22" height="22"/>
    <rect x="178" y="442" width="22" height="22" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
    <rect x="202" y="442" width="22" height="22"/><rect x="226" y="442" width="22" height="22"/><rect x="250" y="442" width="22" height="22"/><rect x="274" y="442" width="22" height="22"/><rect x="298" y="442" width="22" height="22"/><rect x="322" y="442" width="22" height="22"/><rect x="346" y="442" width="22" height="22"/><rect x="370" y="442" width="22" height="22"/><rect x="394" y="442" width="22" height="22"/><rect x="418" y="442" width="22" height="22"/>
    <rect x="58" y="466" width="22" height="22"/><rect x="82" y="466" width="22" height="22"/><rect x="106" y="466" width="22" height="22"/><rect x="130" y="466" width="22" height="22"/><rect x="154" y="466" width="22" height="22"/><rect x="178" y="466" width="22" height="22"/><rect x="202" y="466" width="22" height="22"/><rect x="226" y="466" width="22" height="22"/><rect x="250" y="466" width="22" height="22"/><rect x="274" y="466" width="22" height="22"/><rect x="298" y="466" width="22" height="22"/><rect x="322" y="466" width="22" height="22"/><rect x="346" y="466" width="22" height="22"/><rect x="370" y="466" width="22" height="22"/><rect x="394" y="466" width="22" height="22"/><rect x="418" y="466" width="22" height="22"/>
  </g>
  <text x="189" y="505" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ef6c00">amax = 2.5（块内绝对值最大）</text>
  <g font-size="12.5" fill="#1b5e20">
    <text x="58" y="530">s = 2^⌈log₂(amax / 448)⌉ = 2⁻⁷（E8M0：只能取 2 的整数次幂）</text>
    <text x="58" y="552">量化：x_fp8 = x · 2⁷，舍入到最近的 E4M3 刻度</text>
    <text x="58" y="574">块内最大值：2.5 × 2⁷ = 320 ≤ 448 ✓ 不溢出</text>
  </g>

  <!-- 面板 D：缩放因子存储 -->
  <rect x="590" y="72" width="270" height="524" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="725" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">缩放因子存储（E8M0）</text>
  <text x="725" y="126" text-anchor="middle" font-size="11.5" fill="#bf360c">8 位指数、0 位尾数</text>
  <line x1="540" y1="316" x2="586" y2="316" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <g font-size="11" fill="#546e7a" text-anchor="end">
    <text x="624" y="175">块 0</text><text x="624" y="230">块 1</text><text x="624" y="285">块 2</text><text x="624" y="340">块 3</text><text x="624" y="395">块 4</text>
  </g>
  <g stroke="#90a4ae" stroke-width="1" fill="#ffffff">
    <rect x="630" y="150" width="190" height="38" rx="4"/>
    <rect x="630" y="205" width="190" height="38" rx="4"/>
    <rect x="630" y="260" width="190" height="38" rx="4"/>
    <rect x="630" y="315" width="190" height="38" rx="4"/>
    <rect x="630" y="370" width="190" height="38" rx="4"/>
  </g>
  <g font-size="12.5" fill="#263238" font-family="Consolas, monospace">
    <text x="650" y="174">e = 120</text><text x="650" y="229">e = 123</text><text x="650" y="284">e = 121</text><text x="650" y="339">e = 122</text><text x="650" y="394">e = 120</text>
  </g>
  <g font-size="12" fill="#bf360c" text-anchor="end">
    <text x="806" y="174">s₀ = 2⁻⁷</text><text x="806" y="229">s₁ = 2⁻⁴</text><text x="806" y="284">s₂ = 2⁻⁶</text><text x="806" y="339">s₃ = 2⁻⁵</text><text x="806" y="394">s₄ = 2⁻⁷</text>
  </g>
  <g font-size="12" fill="#37474f">
    <text x="630" y="455">• 每块缩放因子占 1 字节</text>
    <text x="630" y="487">• 字节值为指数 e（偏置 127）</text>
    <text x="630" y="519">• 只能表示 2 的整数次幂</text>
  </g>
</svg>
