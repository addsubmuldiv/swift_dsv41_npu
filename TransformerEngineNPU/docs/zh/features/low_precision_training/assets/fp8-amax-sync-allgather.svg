<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">分布式训练：amax 同步与量化 All-gather</text>
  <text x="450" y="66" text-anchor="middle" font-size="11.5" fill="#546e7a">以 sequence parallelism 中分布在多个 NPU 上的同一逻辑张量为例</text>

  <!-- 各 NPU 本地分片 -->
  <rect x="60" y="85" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="160" y="120" text-anchor="middle" font-size="13" fill="#0d47a1">NPU 0 · 本地分片</text>
  <rect x="350" y="85" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="450" y="120" text-anchor="middle" font-size="13" fill="#0d47a1">NPU 1 · 本地分片</text>
  <rect x="640" y="85" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="740" y="120" text-anchor="middle" font-size="13" fill="#0d47a1">NPU 2 · 本地分片</text>

  <line x1="160" y1="145" x2="160" y2="169" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <line x1="450" y1="145" x2="450" y2="169" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <line x1="740" y1="145" x2="740" y2="169" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 本地 amax -->
  <rect x="60" y="171" width="200" height="60" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="160" y="206" text-anchor="middle" font-size="13" fill="#263238">本地 amax = 2.0</text>
  <rect x="350" y="171" width="200" height="60" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="450" y="206" text-anchor="middle" font-size="13" fill="#263238">本地 amax = 4.0</text>
  <rect x="640" y="171" width="200" height="60" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="740" y="206" text-anchor="middle" font-size="13" fill="#263238">本地 amax = 3.0</text>

  <line x1="160" y1="231" x2="310" y2="276" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <line x1="450" y1="231" x2="450" y2="276" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <line x1="740" y1="231" x2="590" y2="276" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- All-reduce -->
  <rect x="200" y="278" width="500" height="64" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="450" y="304" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#263238">All-reduce(MAX)</text>
  <text x="450" y="328" text-anchor="middle" font-size="12.5" fill="#546e7a">全局 amax = 4.0</text>

  <line x1="450" y1="342" x2="450" y2="374" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 统一 scale 量化 -->
  <rect x="200" y="376" width="500" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="450" y="404" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">统一缩放因子量化本地数据</text>
  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#1b5e20" font-family="Consolas, monospace">α = fp8_max / amax_global → FP8</text>

  <line x1="450" y1="446" x2="450" y2="478" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- All-gather -->
  <rect x="200" y="480" width="500" height="70" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="450" y="508" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#bf360c">All-gather（FP8 分片）</text>
  <text x="450" y="534" text-anchor="middle" font-size="12" fill="#bf360c">每个 NPU 得到拼接后的完整 FP8 张量</text>

  <!-- 注释 -->
  <text x="450" y="584" text-anchor="middle" font-size="11.5" fill="#546e7a">图中 2.0 / 4.0 / 3.0 为示例数值；All-reduce(MAX) 汇总标量 amax，</text>
  <text x="450" y="604" text-anchor="middle" font-size="11.5" fill="#546e7a">All-gather 收集量化后的张量分片，二者是不同的集合通信操作。</text>
</svg>
