<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">浮点数据类型的结构：对 0.3952 的近似</text>
  <text x="610" y="92" font-size="11.5" fill="#546e7a">最接近 0.3952 的可表示值（绝对误差）</text>

  <!-- FP16：1 + 5 + 10 -->
  <text x="140" y="136" text-anchor="end" font-size="14" font-weight="bold" fill="#263238">FP16</text>
  <rect x="150" y="108" width="26" height="44" fill="#455a64"/>
  <rect x="176" y="108" width="130" height="44" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <rect x="306" y="108" width="260" height="44" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <g stroke="#90a4ae" stroke-width="1" opacity="0.6">
    <line x1="202" y1="112" x2="202" y2="148"/><line x1="228" y1="112" x2="228" y2="148"/>
    <line x1="254" y1="112" x2="254" y2="148"/><line x1="280" y1="112" x2="280" y2="148"/>
    <line x1="332" y1="112" x2="332" y2="148"/><line x1="358" y1="112" x2="358" y2="148"/>
    <line x1="384" y1="112" x2="384" y2="148"/><line x1="410" y1="112" x2="410" y2="148"/>
    <line x1="436" y1="112" x2="436" y2="148"/><line x1="462" y1="112" x2="462" y2="148"/>
    <line x1="488" y1="112" x2="488" y2="148"/><line x1="514" y1="112" x2="514" y2="148"/>
    <line x1="540" y1="112" x2="540" y2="148"/>
  </g>
  <text x="163" y="136" text-anchor="middle" font-size="12" fill="#ffffff">S</text>
  <text x="241" y="136" text-anchor="middle" font-size="12" fill="#0d47a1">E</text>
  <text x="436" y="136" text-anchor="middle" font-size="12" fill="#bf360c">M</text>
  <g font-size="10" fill="#546e7a" text-anchor="middle">
    <text x="163" y="166">1</text><text x="241" y="166">5</text><text x="436" y="166">10</text>
  </g>
  <text x="610" y="126" font-size="13" fill="#263238">0.395263671875</text>
  <text x="610" y="144" font-size="11.5" fill="#546e7a">误差 0.000063671875</text>

  <!-- BF16：1 + 8 + 7 -->
  <text x="140" y="221" text-anchor="end" font-size="14" font-weight="bold" fill="#263238">BF16</text>
  <rect x="150" y="193" width="26" height="44" fill="#455a64"/>
  <rect x="176" y="193" width="208" height="44" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <rect x="384" y="193" width="182" height="44" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <g stroke="#90a4ae" stroke-width="1" opacity="0.6">
    <line x1="202" y1="197" x2="202" y2="233"/><line x1="228" y1="197" x2="228" y2="233"/>
    <line x1="254" y1="197" x2="254" y2="233"/><line x1="280" y1="197" x2="280" y2="233"/>
    <line x1="306" y1="197" x2="306" y2="233"/><line x1="332" y1="197" x2="332" y2="233"/>
    <line x1="358" y1="197" x2="358" y2="233"/>
    <line x1="410" y1="197" x2="410" y2="233"/><line x1="436" y1="197" x2="436" y2="233"/>
    <line x1="462" y1="197" x2="462" y2="233"/><line x1="488" y1="197" x2="488" y2="233"/>
    <line x1="514" y1="197" x2="514" y2="233"/><line x1="540" y1="197" x2="540" y2="233"/>
  </g>
  <text x="163" y="221" text-anchor="middle" font-size="12" fill="#ffffff">S</text>
  <text x="280" y="221" text-anchor="middle" font-size="12" fill="#0d47a1">E</text>
  <text x="475" y="221" text-anchor="middle" font-size="12" fill="#bf360c">M</text>
  <g font-size="10" fill="#546e7a" text-anchor="middle">
    <text x="163" y="251">1</text><text x="280" y="251">8</text><text x="475" y="251">7</text>
  </g>
  <text x="610" y="211" font-size="13" fill="#263238">0.39453125</text>
  <text x="610" y="229" font-size="11.5" fill="#546e7a">误差 0.00066875</text>

  <!-- FP8 E4M3：1 + 4 + 3 -->
  <text x="140" y="306" text-anchor="end" font-size="14" font-weight="bold" fill="#263238">FP8 E4M3</text>
  <rect x="150" y="278" width="26" height="44" fill="#455a64"/>
  <rect x="176" y="278" width="104" height="44" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <rect x="280" y="278" width="78" height="44" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <g stroke="#90a4ae" stroke-width="1" opacity="0.6">
    <line x1="202" y1="282" x2="202" y2="318"/><line x1="228" y1="282" x2="228" y2="318"/>
    <line x1="254" y1="282" x2="254" y2="318"/>
    <line x1="306" y1="282" x2="306" y2="318"/><line x1="332" y1="282" x2="332" y2="318"/>
  </g>
  <text x="163" y="306" text-anchor="middle" font-size="12" fill="#ffffff">S</text>
  <text x="228" y="306" text-anchor="middle" font-size="12" fill="#0d47a1">E</text>
  <text x="319" y="306" text-anchor="middle" font-size="12" fill="#bf360c">M</text>
  <g font-size="10" fill="#546e7a" text-anchor="middle">
    <text x="163" y="336">1</text><text x="228" y="336">4</text><text x="319" y="336">3</text>
  </g>
  <text x="610" y="296" font-size="13" fill="#263238">0.40625</text>
  <text x="610" y="314" font-size="11.5" fill="#546e7a">误差 0.01105</text>

  <!-- FP8 E5M2：1 + 5 + 2 -->
  <text x="140" y="391" text-anchor="end" font-size="14" font-weight="bold" fill="#263238">FP8 E5M2</text>
  <rect x="150" y="363" width="26" height="44" fill="#455a64"/>
  <rect x="176" y="363" width="130" height="44" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <rect x="306" y="363" width="52" height="44" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <g stroke="#90a4ae" stroke-width="1" opacity="0.6">
    <line x1="202" y1="367" x2="202" y2="403"/><line x1="228" y1="367" x2="228" y2="403"/>
    <line x1="254" y1="367" x2="254" y2="403"/><line x1="280" y1="367" x2="280" y2="403"/>
    <line x1="332" y1="367" x2="332" y2="403"/>
  </g>
  <text x="163" y="391" text-anchor="middle" font-size="12" fill="#ffffff">S</text>
  <text x="241" y="391" text-anchor="middle" font-size="12" fill="#0d47a1">E</text>
  <text x="332" y="391" text-anchor="middle" font-size="12" fill="#bf360c">M</text>
  <g font-size="10" fill="#546e7a" text-anchor="middle">
    <text x="163" y="421">1</text><text x="241" y="421">5</text><text x="332" y="421">2</text>
  </g>
  <text x="610" y="381" font-size="13" fill="#263238">0.375</text>
  <text x="610" y="399" font-size="11.5" fill="#546e7a">误差 0.0202</text>

  <!-- 图例 -->
  <rect x="60" y="455" width="16" height="16" fill="#455a64"/>
  <text x="84" y="468" font-size="12" fill="#37474f">符号位 S</text>
  <rect x="200" y="455" width="16" height="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="224" y="468" font-size="12" fill="#37474f">指数位 E —— 决定表示范围</text>
  <rect x="480" y="455" width="16" height="16" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="504" y="468" font-size="12" fill="#37474f">尾数位 M —— 决定数值精度</text>

  <text x="60" y="508" font-size="12" fill="#37474f">同为 16 位：FP16（尾数 10 位）的近似误差小于 BF16（尾数 7 位）；同为 8 位：E4M3（尾数 3 位）的误差小于 E5M2（尾数 2 位）。</text>
</svg>
