<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 640" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ============ 上：NN ============ -->
  <text x="354" y="42" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">NN：C = A × B</text>

  <!-- 矩阵 A -->
  <text x="134" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">A</text>
  <rect x="70" y="90" width="128" height="128" fill="#eef3fb" stroke="#9db4d6"/>
  <rect x="70" y="154" width="128" height="32" fill="#f9cb9c" opacity="0.9"/>
  <line x1="102" y1="90" x2="102" y2="218" stroke="#9db4d6"/>
  <line x1="134" y1="90" x2="134" y2="218" stroke="#9db4d6"/>
  <line x1="166" y1="90" x2="166" y2="218" stroke="#9db4d6"/>
  <line x1="70" y1="122" x2="198" y2="122" stroke="#9db4d6"/>
  <line x1="70" y1="154" x2="198" y2="154" stroke="#9db4d6"/>
  <line x1="70" y1="186" x2="198" y2="186" stroke="#9db4d6"/>
  <!-- 行方向箭头 -->
  <line x1="76" y1="170" x2="192" y2="170" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/>

  <text x="244" y="162" text-anchor="middle" font-size="22" fill="#333">×</text>

  <!-- 矩阵 B -->
  <text x="354" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">B</text>
  <rect x="290" y="90" width="128" height="128" fill="#eef3fb" stroke="#9db4d6"/>
  <rect x="322" y="90" width="32" height="128" fill="#9fc5e8" opacity="0.9"/>
  <line x1="322" y1="90" x2="322" y2="218" stroke="#9db4d6"/>
  <line x1="354" y1="90" x2="354" y2="218" stroke="#9db4d6"/>
  <line x1="386" y1="90" x2="386" y2="218" stroke="#9db4d6"/>
  <line x1="290" y1="122" x2="418" y2="122" stroke="#9db4d6"/>
  <line x1="290" y1="154" x2="418" y2="154" stroke="#9db4d6"/>
  <line x1="290" y1="186" x2="418" y2="186" stroke="#9db4d6"/>
  <!-- 列方向箭头 -->
  <line x1="338" y1="96" x2="338" y2="212" stroke="#1d4f91" stroke-width="2" marker-end="url(#arr)"/>

  <text x="464" y="162" text-anchor="middle" font-size="22" fill="#333">＝</text>

  <!-- 结果矩阵 C -->
  <text x="574" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">C</text>
  <rect x="510" y="90" width="128" height="128" fill="#eef3fb" stroke="#9db4d6"/>
  <rect x="542" y="154" width="32" height="32" fill="#ffb266" opacity="0.95" stroke="#b45309"/>
  <line x1="542" y1="90" x2="542" y2="218" stroke="#9db4d6"/>
  <line x1="574" y1="90" x2="574" y2="218" stroke="#9db4d6"/>
  <line x1="606" y1="90" x2="606" y2="218" stroke="#9db4d6"/>
  <line x1="510" y1="122" x2="638" y2="122" stroke="#9db4d6"/>
  <line x1="510" y1="154" x2="638" y2="154" stroke="#9db4d6"/>
  <line x1="510" y1="186" x2="638" y2="186" stroke="#9db4d6"/>

  <text x="134" y="252" text-anchor="middle" font-size="13.5" fill="#444">A：rowwise（沿行求和）</text>
  <text x="354" y="252" text-anchor="middle" font-size="13.5" fill="#444">B：columnwise（沿列求和）</text>
  <text x="574" y="252" text-anchor="middle" font-size="13.5" fill="#444">C：点积结果 Cᵢⱼ</text>

  <!-- ============ 下：NT ============ -->
  <text x="354" y="340" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">NT：C = A × Bᵀ</text>

  <!-- 矩阵 A -->
  <text x="134" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">A</text>
  <rect x="70" y="388" width="128" height="128" fill="#eef3fb" stroke="#9db4d6"/>
  <rect x="70" y="452" width="128" height="32" fill="#f9cb9c" opacity="0.9"/>
  <line x1="102" y1="388" x2="102" y2="516" stroke="#9db4d6"/>
  <line x1="134" y1="388" x2="134" y2="516" stroke="#9db4d6"/>
  <line x1="166" y1="388" x2="166" y2="516" stroke="#9db4d6"/>
  <line x1="70" y1="420" x2="198" y2="420" stroke="#9db4d6"/>
  <line x1="70" y1="452" x2="198" y2="452" stroke="#9db4d6"/>
  <line x1="70" y1="484" x2="198" y2="484" stroke="#9db4d6"/>
  <line x1="76" y1="468" x2="192" y2="468" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/>

  <text x="244" y="460" text-anchor="middle" font-size="22" fill="#333">×</text>

  <!-- 矩阵 B（按行访问） -->
  <text x="354" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">B</text>
  <rect x="290" y="388" width="128" height="128" fill="#eef3fb" stroke="#9db4d6"/>
  <rect x="290" y="420" width="128" height="32" fill="#f9cb9c" opacity="0.9"/>
  <line x1="322" y1="388" x2="322" y2="516" stroke="#9db4d6"/>
  <line x1="354" y1="388" x2="354" y2="516" stroke="#9db4d6"/>
  <line x1="386" y1="388" x2="386" y2="516" stroke="#9db4d6"/>
  <line x1="290" y1="420" x2="418" y2="420" stroke="#9db4d6"/>
  <line x1="290" y1="452" x2="418" y2="452" stroke="#9db4d6"/>
  <line x1="290" y1="484" x2="418" y2="484" stroke="#9db4d6"/>
  <line x1="296" y1="436" x2="412" y2="436" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/>

  <text x="464" y="460" text-anchor="middle" font-size="22" fill="#333">＝</text>

  <!-- 结果矩阵 C -->
  <text x="574" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">C</text>
  <rect x="510" y="388" width="128" height="128" fill="#eef3fb" stroke="#9db4d6"/>
  <rect x="542" y="452" width="32" height="32" fill="#ffb266" opacity="0.95" stroke="#b45309"/>
  <line x1="542" y1="388" x2="542" y2="516" stroke="#9db4d6"/>
  <line x1="574" y1="388" x2="574" y2="516" stroke="#9db4d6"/>
  <line x1="606" y1="388" x2="606" y2="516" stroke="#9db4d6"/>
  <line x1="510" y1="420" x2="638" y2="420" stroke="#9db4d6"/>
  <line x1="510" y1="452" x2="638" y2="452" stroke="#9db4d6"/>
  <line x1="510" y1="484" x2="638" y2="484" stroke="#9db4d6"/>

  <text x="134" y="550" text-anchor="middle" font-size="13.5" fill="#444">A：rowwise（沿行求和）</text>
  <text x="354" y="550" text-anchor="middle" font-size="13.5" fill="#444">B：rowwise（沿行求和）</text>
  <text x="574" y="550" text-anchor="middle" font-size="13.5" fill="#444">C：点积结果 Cᵢⱼ</text>

  <text x="354" y="600" text-anchor="middle" font-size="11" fill="#777">箭头：A、B 沿求和维度的访问方向；C 中的高亮格：对应点积结果</text>
  <text x="354" y="624" text-anchor="middle" font-size="11" fill="#777">C 的后续 usage 取决于其在下一次乘法中的位置与转置状态</text>
</svg>
