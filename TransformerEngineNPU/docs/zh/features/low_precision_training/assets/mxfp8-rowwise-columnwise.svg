    <rect x="486" y="168" width="24" height="24"/><rect x="512" y="168" width="24" height="24"/><rect x="538" y="168" width="24" height="24"/><rect x="564" y="168" width="24" height="24"/><rect x="590" y="168" width="24" height="24"/><rect x="616" y="168" width="24" height="24"/><rect x="642" y="168" width="24" height="24"/><rect x="668" y="168" width="24" height="24"/><rect x="694" y="168" width="24" height="24"/><rect x="720" y="168" width="24" height="24"/><rect x="746" y="168" width="24" height="24"/><rect x="772" y="168" width="24" height="24"/>
    <rect x="486" y="194" width="24" height="24"/><rect x="512" y="194" width="24" height="24"/><rect x="538" y="194" width="24" height="24"/><rect x="564" y="194" width="24" height="24"/><rect x="590" y="194" width="24" height="24"/><rect x="616" y="194" width="24" height="24"/><rect x="642" y="194" width="24" height="24"/><rect x="668" y="194" width="24" height="24"/><rect x="694" y="194" width="24" height="24"/><rect x="720" y="194" width="24" height="24"/><rect x="746" y="194" width="24" height="24"/><rect x="772" y="194" width="24" height="24"/>
    <rect x="486" y="220" width="24" height="24"/><rect x="512" y="220" width="24" height="24"/><rect x="538" y="220" width="24" height="24"/><rect x="564" y="220" width="24" height="24"/><rect x="590" y="220" width="24" height="24"/><rect x="616" y="220" width="24" height="24"/><rect x="642" y="220" width="24" height="24"/><rect x="668" y="220" width="24" height="24"/><rect x="694" y="220" width="24" height="24"/><rect x="720" y="220" width="24" height="24"/><rect x="746" y="220" width="24" height="24"/><rect x="772" y="220" width="24" height="24"/>
    <rect x="486" y="246" width="24" height="24"/><rect x="512" y="246" width="24" height="24"/><rect x="538" y="246" width="24" height="24"/><rect x="564" y="246" width="24" height="24"/><rect x="590" y="246" width="24" height="24"/><rect x="616" y="246" width="24" height="24"/><rect x="642" y="246" width="24" height="24"/><rect x="668" y="246" width="24" height="24"/><rect x="694" y="246" width="24" height="24"/><rect x="720" y="246" width="24" height="24"/><rect x="746" y="246" width="24" height="24"/><rect x="772" y="246" width="24" height="24"/>
  </g>
  <!-- 块边界（每 3 行一条横线） -->
  <g stroke="#ef6c00" stroke-width="2.5">
    <line x1="486" y1="193" x2="796" y2="193"/>
  </g>
  <!-- 选中的元素 x 与其列块 -->
  <rect x="666" y="114" width="28" height="80" rx="3" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="668" y="168" width="24" height="24" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="680" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ef6c00">x</text>
  <text x="660" y="296" text-anchor="middle" font-size="11.5" fill="#bf360c">绿色框 = 一个 32×1 块（一列中连续的 32 个元素）</text>
  <text x="660" y="318" text-anchor="middle" font-size="11.5" fill="#37474f">橙色格子 = 同一个元素 x，其缩放因子来自所在列的块</text>
  <text x="660" y="340" text-anchor="middle" font-size="11" fill="#546e7a">（与左图为同一矩阵、同一个元素）</text>
</svg>
