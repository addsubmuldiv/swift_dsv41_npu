<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">张量级 FP8 的转置处理：一份物理数据，惰性转置视图</text>

  <!-- 量化结果 -->
  <rect x="50" y="120" width="250" height="86" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="175" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">量化结果</text>
  <text x="175" y="182" text-anchor="middle" font-size="12" fill="#0d47a1"><tspan font-family="Consolas, monospace">_data</tspan>（唯一一份 FP8 数据）</text>

  <!-- 分支箭头 -->
  <line x1="300" y1="145" x2="486" y2="123" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <text x="345" y="130" font-size="12" fill="#2e7d32">无需转置</text>

  <line x1="300" y1="181" x2="486" y2="243" stroke="#ef6c00" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <text x="340" y="220" font-size="12" fill="#ef6c00">需要转置</text>

  <!-- 无需转置的 GEMM -->
  <rect x="490" y="88" width="370" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="675" y="115" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">无需转置的 GEMM</text>
  <text x="675" y="140" text-anchor="middle" font-size="12" fill="#1b5e20">直接读取 <tspan font-family="Consolas, monospace">_data</tspan>，无额外开销</text>

  <!-- 需要转置的 GEMM -->
  <rect x="490" y="208" width="370" height="92" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="675" y="234" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#bf360c">需要转置的 GEMM</text>
  <text x="675" y="258" text-anchor="middle" font-size="12" fill="#bf360c"><tspan font-family="Consolas, monospace">_data.t()</tspan> 惰性视图：只交换维度与 stride，零拷贝</text>
  <text x="675" y="280" text-anchor="middle" font-size="12" fill="#bf360c">物理重排在算子内部完成，此刻才开辟内存</text>

  <!-- 底部：同一份存储的两种读取顺序 -->
  <text x="60" y="345" font-size="14" font-weight="bold" fill="#263238">同一份物理存储，两种读取顺序</text>

  <!-- 网格 A：行优先（_data 存储顺序） -->
  <g stroke="#2e7d32" stroke-width="1" fill="#e8f5e9">
    <rect x="60" y="365" width="32" height="32" rx="3"/>
    <rect x="92" y="365" width="32" height="32" rx="3"/>
    <rect x="124" y="365" width="32" height="32" rx="3"/>
    <rect x="156" y="365" width="32" height="32" rx="3"/>
    <rect x="60" y="397" width="32" height="32" rx="3"/>
    <rect x="92" y="397" width="32" height="32" rx="3"/>
    <rect x="124" y="397" width="32" height="32" rx="3"/>
    <rect x="156" y="397" width="32" height="32" rx="3"/>
    <rect x="60" y="429" width="32" height="32" rx="3"/>
    <rect x="92" y="429" width="32" height="32" rx="3"/>
    <rect x="124" y="429" width="32" height="32" rx="3"/>
    <rect x="156" y="429" width="32" height="32" rx="3"/>
  </g>
  <g font-size="13" font-weight="600" fill="#263238" text-anchor="middle">
    <text x="76" y="386">a</text>
    <text x="108" y="386">b</text>
    <text x="140" y="386">c</text>
    <text x="172" y="386">d</text>
    <text x="76" y="418">e</text>
    <text x="108" y="418">f</text>
    <text x="140" y="418">g</text>
    <text x="172" y="418">h</text>
    <text x="76" y="450">i</text>
    <text x="108" y="450">j</text>
    <text x="140" y="450">k</text>
    <text x="172" y="450">l</text>
  </g>
  <text x="124" y="486" text-anchor="middle" font-size="12" fill="#1b5e20">行优先（<tspan font-family="Consolas, monospace">_data</tspan> 的存储顺序）</text>

  <!-- .t() 转换箭头 -->
  <line x1="204" y1="413" x2="240" y2="413" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="222" y="398" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#37474f">.t()</text>

  <!-- 网格 B：列优先（.t() 视图读取顺序） -->
  <g stroke="#ef6c00" stroke-width="1" fill="#fff3e0">
    <rect x="250" y="365" width="32" height="32" rx="3"/>
    <rect x="282" y="365" width="32" height="32" rx="3"/>
    <rect x="314" y="365" width="32" height="32" rx="3"/>
    <rect x="250" y="397" width="32" height="32" rx="3"/>
    <rect x="282" y="397" width="32" height="32" rx="3"/>
    <rect x="314" y="397" width="32" height="32" rx="3"/>
    <rect x="250" y="429" width="32" height="32" rx="3"/>
    <rect x="282" y="429" width="32" height="32" rx="3"/>
    <rect x="314" y="429" width="32" height="32" rx="3"/>
    <rect x="250" y="461" width="32" height="32" rx="3"/>
    <rect x="282" y="461" width="32" height="32" rx="3"/>
    <rect x="314" y="461" width="32" height="32" rx="3"/>
  </g>
  <g font-size="13" font-weight="600" fill="#263238" text-anchor="middle">
    <text x="266" y="386">a</text>
    <text x="298" y="386">e</text>
    <text x="330" y="386">i</text>
    <text x="266" y="418">b</text>
    <text x="298" y="418">f</text>
    <text x="330" y="418">j</text>
    <text x="266" y="450">c</text>
    <text x="298" y="450">g</text>
    <text x="330" y="450">k</text>
    <text x="266" y="482">d</text>
    <text x="298" y="482">h</text>
    <text x="330" y="482">l</text>
  </g>
  <text x="298" y="518" text-anchor="middle" font-size="12" fill="#bf360c">列优先（<tspan font-family="Consolas, monospace">_data.t()</tspan> 的读取顺序）</text>

  <!-- 右侧注释 -->
  <text x="430" y="398" font-size="12.5" fill="#37474f">两种顺序读取的是同一份存储，</text>
  <text x="430" y="422" font-size="12.5" fill="#37474f"><tspan font-family="Consolas, monospace">.t()</tspan> 不拷贝数据、不产生第二份数据。</text>
</svg>
