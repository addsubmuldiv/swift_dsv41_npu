name: transformer_engine.pytorch.permutation.moe_unpermute
api: pytorch
api_type: function_moe_unpermute
# Single route (2026-09-20): the hook generator replaces the curated P0 matrix.
# This module keeps one generator only, so this field and the `atk case -p`
# argument point at the same file.
generate: generate_moe_unpermute_hook
backward: false
standard:
  acc:
    moe_unpermute_allclose:
      bf16_rtol: 1.56e-2
      bf16_atol: 1.56e-2
# ---
# The fields from here on are consumed by the HOOK route.
dtype_numbers: 50  # 3 dtype x 50 = 150 例/种子（泛化口径）
# Boundary track: empty / 0-D inputs are UNTESTED for this module — every flag off.
extra_numbers: 0
# Element-scale quota: threshold in the low-density tail (see GENERALIZATION §5.3).
shape_distributions:
  - [4294967295, 0.4]
inputs:
  # ARITY: the case layout depends on `mode`, and the adapter locates `mode` at
  # slot 2 (permute) or slot 3 (with_probs / pad_with_probs). This schema
  # declares the union (3 tensors + 8 attrs) and the hook rebuilds the per-mode
  # list:
  #   permute        [inp, dy, mode, map_type, spec, E, topk, routing_dtype,
  #                   num_out_tokens, max_token_num]                    (10)
  #   with_probs     [inp, probs, dy, mode, spec, E, topk, routing_dtype,
  #                   num_out_tokens]                                     (9)
  #   pad_with_probs [inp, probs, dy, mode, spec, E, topk, routing_dtype,
  #                   tokens_per_expert_spec, align_size]                 (10)
  # inp: the ORIGINAL (unpermuted) token tensor [num_tokens, hidden] — the
  # adapter runs the matching permute API first and feeds its output on.
  - type: tensor
    dtypes:
      values: [bf16, fp16, fp32]
    ranges:
      valid:
        # 值域泛化：宽区间 + 近零小区间，每条例等概率取其一（多区间 values 池）。
        values: [ [ -5, 5 ], [ -0.001, 0.001 ] ]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [16, 17, 24, 32, 48, 64, 96, 128, 256, 512, 1024, 2048]
      max_length: 33554432
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
  # probs: the 2-D [num_tokens, num_experts] probabilities that become
  # `merging_probs` in with_probs / pad_with_probs (the permute API's 1-D
  # permuted output is never fed to unpermute). Dead slot in permute mode.
  - type: tensor
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[0.0, 1.0]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [16]
      max_length: 65536
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
  # dy: grad_output for the UNPERMUTED output, [num_tokens, hidden] — derived by
  # the hook; raw sampling pinned to a placeholder. In permute mode the mode attr
  # takes this slot instead.
  - type: tensor
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-0.5, 0.5]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [16]
      max_length: 65536
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
  # mode: which permute API the adapter runs first (and which layout follows).
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [permute, with_probs, pad_with_probs]
  # map_type: permute mode only (the other modes are always mask).
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [mask, index]
  # routing_spec: per-expert allocation STYLE; the real spec string is rendered
  # by the hook (its row count must equal the sampled token count).
  #   uniform / uneven / skewed (router collapse) / empty_expert (underloaded)
  # Dropped tokens are NOT generated (see the moe_permute hook).
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [uniform, uneven, skewed, empty_expert]
  # num_experts.
  - type: attr
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [4, 8, 16, 32, 64, 128]
  # topk (clamped by the hook; forced to 1 on the index path).
  - type: attr
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 2, 4, 8]
  # routing_dtype: "bool" (default) or the legacy "int32".
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [bool, int32]
  # num_out_tokens (permute / with_probs, the adapter does int() on it) or
  # tokens_per_expert_spec (pad_with_probs, ','-joined) — both derived by the
  # hook. Declared as string so ONE dtype covers both modes: with a dual
  # [int, string] pool the sampler can pick int while the hook writes a string,
  # and the runtime's int() then overflows to INT64_MIN. Placeholder pool.
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["1,1"]
  # max_token_num (permute only) or align_size (pad_with_probs only) — derived by
  # the hook (-1 / the smallest legal align). Placeholder pool.
  - type: attr
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [-1]
