name: transformer_engine.pytorch.tensor.float8_tensor.Float8Tensor
api: pytorch
api_type: function_float8_quantization
backward: false
standard:
  acc: mixed_tolerance_bm
shape_distributions:
  - [4294967295, 0.4]
# Number of ordinary cases per input dtype.
dtype_numbers: 0
# Boundary cases are generated separately from ordinary cases.
extra_numbers: all
inputs:
  # x: tensor to quantize.
  - type: tensor
    dtypes:
      values: [bf16, fp16, fp32]
    ranges:
      valid:
        values: [[-0.5, 0.5]]
    shapes:
      dim_numbers:
        values: [2, 3]
      dim_values:
        values: [1, 2048]
      max_length: 4294967295
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: true
      has_upper_border: false
      has_lower_border: true
  # fp8_format: target FP8 format.
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [e4m3, e5m2]
