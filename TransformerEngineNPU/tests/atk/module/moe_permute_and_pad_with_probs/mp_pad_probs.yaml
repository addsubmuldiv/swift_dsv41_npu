name: transformer_engine.pytorch.permutation.moe_permute_and_pad_with_probs
api: pytorch
api_type: function_mp_pad_probs
# Single route (2026-09-20): the hook generator replaces the curated P0 matrix.
# This module keeps one generator only, so this field and the `atk case -p`
# argument point at the same file.
generate: generate_mp_pad_probs_hook
backward: false
standard:
  acc:
    moe_permute_and_pad_with_probs_allclose:
      bf16_rtol: 1.56e-2
      bf16_atol: 1.56e-2
# ---
# The fields from here on are consumed by the HOOK route.
dtype_numbers: 50  # 3 dtype x 50 = 150 例/种子（泛化口径）
# Boundary track: empty / 0-D inputs are UNTESTED for this module — every flag off.
extra_numbers: 0
# Element-scale quota: threshold in the low-density tail (see GENERALIZATION §5.3).
shape_distributions:
  - [4294967295, 0.4]
inputs:
  # inp: token hidden states, [num_tokens, hidden].
  - type: tensor
    dtypes:
      values: [bf16, fp16, fp32]
    ranges:
      valid:
        # 值域泛化：宽区间 + 近零小区间，每条例等概率取其一（多区间 values 池）。
        values: [ [ -5, 5 ], [ -0.001, 0.001 ] ]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [16, 17, 24, 32, 48, 64, 96, 128, 256, 512, 1024, 2048]
      max_length: 33554432
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
  # probs: routing probabilities, [num_tokens, num_experts] (derived by the hook;
  # gathered by the same routing map as inp, and also the source of the
  # merging_probs the unpermute side consumes).
  - type: tensor
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-0.5, 0.5]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [16]
      max_length: 65536
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
  # dy / dy_probs: grad_outputs for the PADDED output, [padded, hidden] / [padded].
  # Row count derived by the hook (sum of the align-rounded received counts).
  - type: tensor
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-0.5, 0.5]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [16]
      max_length: 65536
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
  - type: tensor
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-0.5, 0.5]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [16]
      max_length: 65536
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
  # routing_spec: per-expert allocation STYLE; the real spec string is rendered
  # by the hook (its row count must equal the sampled token count).
  #   uniform / uneven / skewed (router collapse) / empty_expert (underloaded)
  # Dropped tokens are NOT generated (the curated matrix excluded them, and
  # re-adding them failed on device — see the moe_permute hook).
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [uniform, uneven, skewed, empty_expert]
  # num_experts.
  - type: attr
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [4, 8, 16, 32, 64, 128]
  # topk (clamped to [1, num_experts] by the hook).
  - type: attr
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 2, 4, 8]
  # routing_dtype: "bool" (default) or the legacy "int32".
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [bool, int32]
  # tokens_per_expert_spec: ','-joined per-expert RECEIVED-token counts. Derived
  # by the hook from the same rendered routing spec (a token routes to topk
  # experts, so this is not the owner allocation); must have exactly E values.
  # The pool is a placeholder — the hook always overwrites it.
  - type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["1,1"]
  # align_size: derived by the hook — the smallest value whose align-rounded
  # received counts sum to a multiple of num_experts (align == E always works).
  # Placeholder pool.
  - type: attr
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1]
