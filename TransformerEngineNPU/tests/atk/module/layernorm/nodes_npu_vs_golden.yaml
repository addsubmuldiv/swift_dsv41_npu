nodes:
  - backend: npu
    name: "0"
    devices: [0]
    task: [accuracy]
    output_path: ./atk_layernorm_output
  # Non-executing node for previously saved GPU outputs. Use results from
  # the same phase, saved inputs and plugin version as the NPU task.
  # collect_nvte_golden.py exports layernorm_cases_offline/<stem>.json and
  # layernorm_goldens/cpu_nvte/<stem>/<case_id>/output_N.pt.
  - backend: cpu
    name: nvte
    task: [accuracy_load]
    output_path: ./layernorm_goldens
